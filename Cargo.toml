[workspace]
resolver = "2"
members = [
    "crates/moodscore-dsp",
    "crates/moodscore-synth",
    "crates/moodscore-engine",
    "crates/moodscore-director",
    "crates/moodscore-mcp",
    "crates/moodscore",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JavierBaal/Moodscore"
rust-version = "1.89"

[workspace.dependencies]
moodscore-dsp = { path = "crates/moodscore-dsp" }
moodscore-synth = { path = "crates/moodscore-synth" }
moodscore-engine = { path = "crates/moodscore-engine" }
moodscore-director = { path = "crates/moodscore-director" }
moodscore-mcp = { path = "crates/moodscore-mcp" }
hound = "3.5"
rtrb = "0.3"
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time", "sync"] }
rmcp = { version = "3.11", features = ["server", "macros", "transport-io"] }

[profile.dev]
# DSP code is unusable unoptimised; keep debug builds fast enough to listen to.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
